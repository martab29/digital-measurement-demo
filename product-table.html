<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oak Side Table | Demo Store</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Demo Store</h1>

    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart</a>
    </nav>
  </header>
  <main>

  <a href="products.html">← Back to products</a>

  <section class="product-detail">

    <div class="product-detail-image">
      <img src="images/table.jpg" alt="Oak Side Table">
    </div>

    <div class="product-detail-info">

      <h2>Oak Side Table</h2>

      <p>
        A solid oak side table with a simple and timeless design.
      </p>

      <p class="product-detail-price">€129.00</p>

      <label for="finish">Choose a finish:</label>

      <select id="finish" name="finish">
        <option value="natural">Natural</option>
        <option value="dark">Dark</option>
      </select>

      <br><br>

      <button id="add-to-cart" type="button">Add to cart</button>

    </div>

  </section>

</main>


  
  <footer>
    <p>Demo Store — Digital Measurement Project</p>
  </footer>

<script src="script.js"></script>

<script>
  const addToCartButton = document.getElementById("add-to-cart");

  addToCartButton.addEventListener("click", function() {

    const selectedFinish = document.getElementById("finish").value;

    const product = {
      id: "TABLE001",
      name: "Oak Side Table",
      price: 129.00,
      variant: selectedFinish
    };

    addToCart(product);

  });
</script>
  
</body>
</html>
