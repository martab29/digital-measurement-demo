<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nordic Lounge Chair | Demo Store</title>
</head>

<body>

  <header>
    <h1>Demo Store</h1>

    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart</a>
    </nav>
  </header>

  <main>

    <a href="products.html">Back to products</a>

    <section>

      <h2>Nordic Lounge Chair</h2>

      <p>
        A minimalist lounge chair designed for comfort and everyday use.
      </p>

      <p><strong>€249.00</strong></p>

      <label for="color">Choose a colour:</label>

      <select id="color" name="color">
        <option value="beige">Beige</option>
        <option value="grey">Grey</option>
        <option value="green">Green</option>
      </select>

      <br><br>

      <button id="add-to-cart" type="button">Add to cart</button>

      <h3>Not sure about the colour?</h3>

      <p>
        Request a free fabric sample before placing your order.
      </p>

      <button type="button">Request a sample</button>

    </section>

  </main>

  <footer>
    <p>Demo Store — Digital Measurement Project</p>
  </footer>


  <script src="script.js"></script>

<script>
  const addToCartButton = document.getElementById("add-to-cart");

  addToCartButton.addEventListener("click", function() {

    const selectedColor = document.getElementById("color").value;

    const product = {
      id: "CHAIR001",
      name: "Nordic Lounge Chair",
      price: 249.00,
      variant: selectedColor
    };

    addToCart(product);

  });
</script>

</body>
</html>
